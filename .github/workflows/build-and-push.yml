name: Build and Push Microservice Images

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && steps.all.outputs.services || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      # workflow_dispatch has no "before" commit to diff against, so build everything
      - id: all
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'services=["accounting","ad","cart","checkout","currency","email","flagd-ui","fraud-detection","frontend","frontend-proxy","image-provider","load-generator","payment","product-catalog","quote","recommendation","shipping"]' >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            accounting: ['src/accounting/**']
            ad: ['src/ad/**']
            cart: ['src/cart/**']
            checkout: ['src/checkout/**']
            currency: ['src/currency/**']
            email: ['src/email/**']
            flagd-ui: ['src/flagd-ui/**']
            fraud-detection: ['src/fraud-detection/**']
            frontend: ['src/frontend/**']
            frontend-proxy: ['src/frontend-proxy/**']
            image-provider: ['src/image-provider/**']
            load-generator: ['src/load-generator/**']
            payment: ['src/payment/**']
            product-catalog: ['src/product-catalog/**']
            quote: ['src/quote/**']
            recommendation: ['src/recommendation/**']
            shipping: ['src/shipping/**']

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        include:
          - service: accounting
            context: src/accounting
            dockerfile: src/accounting/Dockerfile
          - service: ad
            context: src/ad
            dockerfile: src/ad/Dockerfile
          - service: cart
            context: src/cart
            dockerfile: src/cart/src/Dockerfile
          - service: checkout
            context: src/checkout
            dockerfile: src/checkout/Dockerfile
          - service: currency
            context: src/currency
            dockerfile: src/currency/Dockerfile
          - service: email
            context: src/email
            dockerfile: src/email/Dockerfile
          - service: flagd-ui
            context: src/flagd-ui
            dockerfile: src/flagd-ui/Dockerfile
          - service: fraud-detection
            context: src/fraud-detection
            dockerfile: src/fraud-detection/Dockerfile
          - service: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - service: frontend-proxy
            context: src/frontend-proxy
            dockerfile: src/frontend-proxy/Dockerfile
          - service: image-provider
            context: src/image-provider
            dockerfile: src/image-provider/Dockerfile
          - service: load-generator
            context: src/load-generator
            dockerfile: src/load-generator/Dockerfile
          - service: payment
            context: src/payment
            dockerfile: src/payment/Dockerfile
          - service: product-catalog
            context: src/product-catalog
            dockerfile: src/product-catalog/Dockerfile
          - service: quote
            context: src/quote
            dockerfile: src/quote/Dockerfile
          - service: recommendation
            context: src/recommendation
            dockerfile: src/recommendation/Dockerfile
          - service: shipping
            context: src/shipping
            dockerfile: src/shipping/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
