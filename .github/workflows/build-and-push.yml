name: Build and Push Microservice Images

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && steps.all.outputs.services || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      # workflow_dispatch has no "before" commit to diff against, so build everything
      - id: all
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'services=["accounting","ad","cart","checkout","currency","email","flagd-ui","fraud-detection","frontend","frontend-proxy","image-provider","load-generator","payment","product-catalog","quote","recommendation","shipping"]' >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            accounting: ['src/accounting/**']
            ad: ['src/ad/**']
            cart: ['src/cart/**']
            checkout: ['src/checkout/**']
            currency: ['src/currency/**']
            email: ['src/email/**']
            flagd-ui: ['src/flagd-ui/**']
            fraud-detection: ['src/fraud-detection/**']
            frontend: ['src/frontend/**']
            frontend-proxy: ['src/frontend-proxy/**']
            image-provider: ['src/image-provider/**']
            load-generator: ['src/load-generator/**']
            payment: ['src/payment/**']
            product-catalog: ['src/product-catalog/**']
            quote: ['src/quote/**']
            recommendation: ['src/recommendation/**']
            shipping: ['src/shipping/**']

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        include:
          - service: accounting
            context: src/accounting
            dockerfile: src/accounting/Dockerfile
            imageSuffix: accountingservice
          - service: ad
            context: src/ad
            dockerfile: src/ad/Dockerfile
            imageSuffix: adservice
          - service: cart
            context: src/cart/src
            dockerfile: src/cart/src/Dockerfile
            imageSuffix: cartservice
          - service: checkout
            context: src/checkout
            dockerfile: src/checkout/Dockerfile
            imageSuffix: checkoutservice
          - service: currency
            context: src/currency
            dockerfile: src/currency/Dockerfile
            imageSuffix: currencyservice
          - service: email
            context: src/email
            dockerfile: src/email/Dockerfile
            imageSuffix: emailservice
          - service: flagd-ui
            context: src/flagd-ui
            dockerfile: src/flagd-ui/Dockerfile
            imageSuffix: flagdui
          - service: fraud-detection
            context: src/fraud-detection
            dockerfile: src/fraud-detection/Dockerfile
            imageSuffix: frauddetectionservice
          - service: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
            imageSuffix: frontend
          - service: frontend-proxy
            context: src/frontend-proxy
            dockerfile: src/frontend-proxy/Dockerfile
            imageSuffix: frontendproxy
          - service: image-provider
            context: src/image-provider
            dockerfile: src/image-provider/Dockerfile
            imageSuffix: imageprovider
          - service: load-generator
            context: src/load-generator
            dockerfile: src/load-generator/Dockerfile
            imageSuffix: loadgenerator
          - service: payment
            context: src/payment
            dockerfile: src/payment/Dockerfile
            imageSuffix: paymentservice
          - service: product-catalog
            context: src/product-catalog
            dockerfile: src/product-catalog/Dockerfile
            imageSuffix: productcatalogservice
          - service: quote
            context: src/quote
            dockerfile: src/quote/Dockerfile
            imageSuffix: quoteservice
          - service: recommendation
            context: src/recommendation
            dockerfile: src/recommendation/Dockerfile
            imageSuffix: recommendationservice
          - service: shipping
            context: src/shipping
            dockerfile: src/shipping/Dockerfile
            imageSuffix: shippingservice
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans against the self-hosted SonarQube server (EC2, see README). continue-on-error keeps
      # this report-only, matching the Trivy step below, rather than blocking pushes on findings.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.context }}
          args: >
            -Dsonar.projectKey=otel-demo-${{ matrix.service }}
            -Dsonar.sources=.

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          load: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Report-only (exit-code 0): scans the freshly built image but never blocks the push,
      # per team decision. Results still land in the repo's Security tab.
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}

      # GitOps: point deployment-service.yml at the image we just pushed and push that back to
      # main. Matrix jobs run in parallel, so this retries with a rebase on push conflicts instead
      # of assuming it's the only job writing to main.
      - name: Update deployment-service.yml
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_SUFFIX: ${{ matrix.imageSuffix }}
          NEW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            sed -i "s#image: 'ghcr.io/open-telemetry/demo:[^']*-${IMAGE_SUFFIX}'#image: '${NEW_IMAGE}'#" deployment-service.yml
            sed -i "s#image: '${DOCKERHUB_USERNAME}/${SERVICE}:[^']*'#image: '${NEW_IMAGE}'#" deployment-service.yml
            if git diff --quiet -- deployment-service.yml; then
              echo "deployment-service.yml already up to date for ${SERVICE}"
              break
            fi
            git add deployment-service.yml
            git commit -m "chore(${SERVICE}): update image to ${NEW_IMAGE}"
            if git push origin HEAD:main; then
              break
            fi
            echo "Push conflict, retrying (attempt ${attempt})..."
            sleep $(( (RANDOM % 5) + 1 ))
          done
