# Observability stack: OTel Collector, Jaeger, Prometheus, Grafana.
#
# Every one of the 17 app services already sends telemetry to
# http://opentelemetry-demo-otelcol:4317 (see each Deployment's
# OTEL_EXPORTER_OTLP_ENDPOINT) and frontend-proxy already expects
# opentelemetry-demo-grafana / opentelemetry-demo-jaeger-query to exist
# (GRAFANA_HOST/PORT, JAEGER_HOST/PORT) - this file is what actually
# stands those up, wired to the names already referenced elsewhere.
#
# Config here is intentionally simpler than upstream's main-branch
# otelcol-config.yml: that version uses experimental "profiles"
# pipelines/connectors and Docker/Postgres/Redis receivers that don't
# apply to this K8s-only deployment (or may not even exist in the
# collector-contrib:0.120.0 image pinned in .env). Image versions below
# match .env exactly.

apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-otelcol-config
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  otelcol-config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:

    connectors:
      spanmetrics:

    exporters:
      debug:
        verbosity: basic
      otlp/jaeger:
        endpoint: opentelemetry-demo-jaeger-query:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlp/jaeger, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [debug, prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-otelcol
  labels:
    app.kubernetes.io/component: otelcol
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889
  selector:
    app.kubernetes.io/component: otelcol
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-otelcol
  labels:
    app.kubernetes.io/component: otelcol
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: otelcol
  template:
    metadata:
      labels:
        app.kubernetes.io/component: otelcol
    spec:
      containers:
        - name: otelcol
          image: 'ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.120.0'
          args:
            - --config=/etc/otelcol/otelcol-config.yml
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
          resources:
            limits:
              memory: 300Mi
          volumeMounts:
            - name: otelcol-config
              mountPath: /etc/otelcol
      volumes:
        - name: otelcol-config
          configMap:
            name: opentelemetry-demo-otelcol-config
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-jaeger-query
  labels:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
  selector:
    app.kubernetes.io/component: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-jaeger
  labels:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/component: jaeger
    spec:
      containers:
        - name: jaeger
          image: 'jaegertracing/all-in-one:1.66.0'
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: METRICS_STORAGE_TYPE
              value: prometheus
            - name: PROMETHEUS_SERVER_URL
              value: http://opentelemetry-demo-prometheus:9090
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          resources:
            limits:
              memory: 500Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-prometheus-config
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  prometheus-config.yaml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ['opentelemetry-demo-otelcol:8889']
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-prometheus
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: 'quay.io/prometheus/prometheus:v3.2.0'
          args:
            - --config.file=/etc/prometheus/prometheus-config.yaml
            - --storage.tsdb.retention.time=6h
          ports:
            - containerPort: 9090
          resources:
            limits:
              memory: 1000Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: opentelemetry-demo-prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-grafana-datasources
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: webstore-metrics
        type: prometheus
        access: proxy
        url: http://opentelemetry-demo-prometheus:9090
        isDefault: true
      - name: Jaeger
        uid: webstore-traces
        type: jaeger
        access: proxy
        url: http://opentelemetry-demo-jaeger-query:16686
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-grafana
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/component: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-grafana
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: 'grafana/grafana:11.5.2'
          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 200Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: opentelemetry-demo-grafana-datasources
